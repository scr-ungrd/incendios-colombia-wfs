name: Sync from jorgealpala/incendios-colombia-wfs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/jorgealpala/incendios-colombia-wfs.git
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit -m "Sync from jorgealpala/incendios-colombia-wfs"

      - name: Push changes
        run: git push origin main
